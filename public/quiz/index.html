<body>
<div class="app" id="app">
  <header class="topo">
    <div class="topo-linha">
      <button type="button" class="voltar" id="voltar" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="marca" aria-label="Voxen | Zyron">
        <span class="marca-z"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M18 16 L46 16 L46 25.5 L30.5 38.5 L46 38.5 L46 48 L18 48 L18 38.5 L33.5 25.5 L18 25.5 Z" fill="#0a0a0a"/></svg></span>
        <span class="marca-nome" aria-hidden="true">ZYRON</span>
      </span>
      <span class="ato" aria-hidden="true"><span class="ato-num">I</span><i class="ato-fio"></i><span class="ato-nome">VOCÊ</span></span>
    </div>
    <div class="progresso" role="progressbar" aria-label="Progresso do diagnóstico" aria-valuemin="0" aria-valuemax="100" aria-valuenow="7"><i></i></div>
  </header>
  <main class="palco" id="palco" tabindex="-1">
    <!-- o topo da capa já vem pronto (aparece antes do JavaScript, no 4G lento); a T01 monta por cima, igual, no mesmo lugar.
         O texto é o de config/copy.pt-BR.json (posicao.chip, titulo e apoio): o teste de regras da casa confere que bate.
         Quem volta no meio do quiz não vê este topo (js/casca.js) -->
    <section class="tela t-posicao primeira" data-casca aria-busy="true">
      <div class="entra">
        <span class="cap-chip"><i></i>DIAGNÓSTICO DO ATLETA · GRÁTIS</span>
        <h1 class="titulo">Descubra por que você ainda não <em class="enf">chegou</em> lá.</h1>
        <p class="apoio">Em poucos minutos, o diagnóstico da Voxen&nbsp;|&#8288;&nbsp;Zyron mostra o que travou a sua carreira e qual é o caminho.</p>
      </div>
    </section>
  </main>
  <div class="barra" id="barra"></div>
</div>
<noscript><p style="padding:24px;color:#ddd;font:16px/1.5 system-ui">Pra fazer o diagnóstico, ative o JavaScript do navegador.</p></noscript>
